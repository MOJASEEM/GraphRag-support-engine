<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Escalation Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div>
        <h1>Support Escalation Engine</h1>
        <p>Ticket intelligence for faster, clearer decisions</p>
      </div>
    </div>
    <span class="system-status"><span aria-hidden="true"></span>System ready</span>
  </header>

  <div class="main-grid">
    <div class="chat-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Case desk</p>
          <h2>Ask about a support case</h2>
        </div>
        <span class="panel-index">01</span>
      </div>
      <div class="messages" id="messages"></div>
      <form class="input-row" id="chatForm">
        <label class="sr-only" for="questionInput">Support question</label>
        <input type="text" id="questionInput" placeholder="Ask about a ticket or customer..." autocomplete="off" />
        <button type="submit"><span>Ask</span><span aria-hidden="true">&#8594;</span></button>
      </form>
    </div>

    <div class="graph-panel">
      <div class="panel-heading graph-heading">
        <div>
          <p class="eyebrow">Knowledge graph</p>
          <h2>Live traversal</h2>
        </div>
        <span class="panel-index">02</span>
      </div>
      <svg id="graphCanvas" viewBox="0 0 400 400"></svg>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
